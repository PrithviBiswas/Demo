<!DOCTYPE html>
<html>
<head>
    <title>Image Annotation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Image Annotation Tool</h1>
        <div class="controls">
            <input type="file" id="imageUpload" accept="image/*">
            <div class="class-controls">
                <div class="class-input">
                    <input type="text" id="newClassName" placeholder="New class name">
                    <select id="newClassColor">
                        <option value="rgba(255,0,0,0.5)">Red</option>
                        <option value="rgba(0,255,0,0.5)">Green</option>
                        <option value="rgba(0,0,255,0.5)">Blue</option>
                        <option value="rgba(255,255,0,0.5)">Yellow</option>
                        <option value="rgba(255,0,255,0.5)">Magenta</option>
                    </select>
                    <button id="addClassBtn">Add Class</button>
                </div>
                <div id="classList" class="class-list"></div>
            </div>
            <div class="draw-controls">
                <button id="drawBtn">Draw Polygon</button>
                <button id="undoBtn">Undo</button>
                <button id="clearBtn">Clear Canvas</button>
                <button id="saveBtn">Save Annotation</button>
            </div>
        </div>
        <canvas id="annotationCanvas"></canvas>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
